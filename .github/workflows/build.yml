name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Protocol tests
        run: dotnet run --project tests/Silverbud.Tests -c Release

      - name: Publish single-file exe
        run: dotnet publish src/Silverbud/Silverbud.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Silverbud
          path: publish/Silverbud.exe
